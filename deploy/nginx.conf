# Daybook — nginx site config.
# Replace daybook.example with the real domain, then:
#   sudo ln -s /etc/nginx/sites-available/daybook /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d daybook.example
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name daybook.example;
    # certbot rewrites this block to redirect to https.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name daybook.example;

    # --- certbot fills in ssl_certificate / ssl_certificate_key ---

    # HSTS: 6 months. Only enable once the domain is settled.
    add_header Strict-Transport-Security "max-age=15552000" always;

    root /var/www/daybook/dist;
    index index.html;

    # The api proxies to the Express process. Nothing else leaves this box.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Getting the cache rules wrong strands users on an old service worker:
    # no-cache on index.html and sw.js, long cache on hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /icons/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
